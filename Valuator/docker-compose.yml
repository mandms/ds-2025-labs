version: '3.8'

services:
  # ASP.NET Core приложение
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EXTERNAL_PORT=5001
    depends_on:
      - redis
    networks:
      - app-network
    ports:
      - "5001:5001"

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - EXTERNAL_PORT=5002
    depends_on:
      - app1
    networks:
      - app-network
    ports:
      - "5002:5002"

  # Redis
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
    networks:
      - app-network

# Сеть для связи между контейнерами
networks:
  app-network:
    driver: bridge