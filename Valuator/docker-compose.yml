version: '3.8'

services:
  # ASP.NET Core приложение
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EXTERNAL_PORT=5001
    depends_on:
      - redis
      - rabbitmq
    networks:
      - app-network
    ports:
      - "5001:5001"

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - EXTERNAL_PORT=5002
    depends_on:
      - app1
    networks:
      - app-network
    ports:
      - "5002:5002"

  rank_calculator1:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
      - ASPNETCORE_URLS=http://0.0.0.0:5003
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      app1:
        condition: service_started
    networks:
      - app-network
    ports:
      - "5003:5003"

  rank_calculator2:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
      - ASPNETCORE_URLS=http://0.0.0.0:5004
    depends_on:
      rank_calculator1:
        condition: service_started
    networks:
      - app-network
    ports:
      - "5004:5004"

  events_logger1:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
    depends_on:
      rank_calculator2:
        condition: service_started
    networks:
      - app-network

  events_logger2:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
    depends_on:
      events_logger1:
        condition: service_started
    networks:
      - app-network

  # Redis
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=123
    ports:
      - "5672:5672"  # AMQP
      - "15672:15672"  # Web UI
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
      - "80:80"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - rank_calculator1
      - rank_calculator2
    networks:
      - app-network

  selenium-hub:
    image: selenium/hub:4.11.0
    container_name: selenium-hub
    depends_on:
      - events_logger2
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    networks:
      - app-network
  
  chrome:
    image: selenium/node-chrome:4.11.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_VNC_NO_PASSWORD=true
    ports:
      - "6900:5900"
    networks:
      - app-network

  edge:
    image: selenium/node-edge:4.11.0
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_VNC_NO_PASSWORD=true
    ports:
      - "6901:5900"
    networks:
      - app-network
  tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "dotnet restore && dotnet build && dotnet test ./../RankTests/RankTests.csproj --logger:trx"
    depends_on:
      selenium-hub:
        condition: service_healthy
      app1:
        condition: service_started
      app2:
        condition: service_started
    networks:
      - app-network

# Сеть для связи между контейнерами
networks:
  app-network:
    driver: bridge
