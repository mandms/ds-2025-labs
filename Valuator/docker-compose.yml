version: '3.8'

x-redis-config: &redis-config
      image: redis:latest
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - REDIS_USER=${REDIS_USER}
        - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
      command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

services:
  # ASP.NET Core приложение
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EXTERNAL_PORT=5001
    depends_on:
      - redis_asia
      - rabbitmq
    networks:
      - app-network
    ports:
      - "5001:5001"

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - EXTERNAL_PORT=5002
    depends_on:
      - app1
    networks:
      - app-network
    ports:
      - "5002:5002"

  rank_calculator1:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis_asia:
        condition: service_healthy
      app1:
        condition: service_started
    networks:
      - app-network

  rank_calculator2:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
    depends_on:
      rank_calculator1:
        condition: service_started
    networks:
      - app-network

  events_logger1:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
    depends_on:
      rank_calculator2:
        condition: service_started
    networks:
      - app-network

  events_logger2:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
    depends_on:
      events_logger1:
        condition: service_started
    networks:
      - app-network

  # Redis
  redis_main:
    image: redis:latest
    container_name: redis_main
    <<: *redis-config
    ports:
      - "6379:6379"

  redis_ru:
    image: redis:latest
    container_name: redis_ru
    <<: *redis-config
    ports:
      - "6380:6379"
    depends_on:
      - redis_main

  redis_eu:
    image: redis:latest
    container_name: redis_eu
    <<: *redis-config
    ports:
      - "6381:6379"
    depends_on:
      - redis_ru

  redis_asia:
    image: redis:latest
    container_name: redis_asia
    <<: *redis-config
    ports:
      - "6382:6379"
    depends_on:
      - redis_eu

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"  # AMQP
      - "15672:15672"  # Web UI
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
    networks:
      - app-network

# Сеть для связи между контейнерами
networks:
  app-network:
    driver: bridge